name: Setup uv and Python
description: Install Astral uv and a Python version for CI

inputs:
  python-version:
    description: Python version for uv to provision
    required: true
  working-directory:
    description: Directory passed to subsequent steps (caller sets defaults)
    required: false
    default: "."

runs:
  using: composite
  steps:
    - id: uv_version
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../dependencies/emit-uv-version.sh"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ steps.uv_version.outputs.version }}

    - name: Pin Python
      shell: bash
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        cd "$INPUT_WORKING_DIRECTORY"
        uv python install "$INPUT_PYTHON_VERSION"
