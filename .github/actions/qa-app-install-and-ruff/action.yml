---
name: Install application and lint sources
description: >
  Installs application dependencies when the workflow says to, writes docstring lint
  configuration for the chosen convention, and runs check plus format verification.
  Writes ruff.json and ruff_format.txt into the quality output directory.
inputs:
  workspace:
    required: true
  working-directory:
    required: true
  quality-output-dir:
    required: true
  runner-temp:
    description: e.g. runner.temp
    required: true
  docstring-format:
    required: true
  github-event-name:
    required: true
  app-install-command:
    required: false
    default: ''
  installable-app:
    description: When false, do not uv sync an application package
    required: false
    default: 'true'
  generated-paths:
    description: >-
      Comma-separated paths of generated code, relative to working-directory.
      Ruff skips them. Hand-written code is not a generated path.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install app dependencies if needed
      shell: bash
      env:
        WS: ${{ inputs.workspace }}
        WD: ${{ inputs.working-directory }}
        INSTALL_CMD: ${{ inputs.app-install-command }}
        EVENT: ${{ inputs.github-event-name }}
        INSTALLABLE: ${{ inputs.installable-app }}
      run: |
        set -euo pipefail
        if [ "${INSTALLABLE}" = "false" ]; then
          echo "installable_app=false; skipping package install"
          exit 0
        fi
        cd "$WS/$WD"
        run_install() {
          # Login shell + one parse (avoid eval); input must be trusted workflow config
          bash -lc "$INSTALL_CMD"
        }
        if [ "$EVENT" = "workflow_dispatch" ]; then
          if [ -n "$INSTALL_CMD" ]; then
            run_install
          elif [ -f pyproject.toml ]; then uv sync --all-groups --all-extras
          elif [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
        elif [ -n "$INSTALL_CMD" ]; then
          run_install
        fi
    - name: Write docstring lint configuration
      shell: bash
      env:
        INPUT_DOCSTRING_FORMAT: ${{ inputs.docstring-format }}
        TMP: ${{ inputs.runner-temp }}
        WS: ${{ inputs.workspace }}
        WD: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        case "$INPUT_DOCSTRING_FORMAT" in
          Google|google) CONV=google ;;
          Numpy|numpy) CONV=numpy ;;
          Pep257|pep257) CONV=pep257 ;;
          *) CONV=google ;;
        esac
        # A bare config replaces the project file, so line-length falls back
        # to 88. Extend the project file when one exists.
        ROOT="$(cd "$WS/$WD" && pwd)"
        EXTEND=""
        if [ -f "$ROOT/ruff.toml" ]; then
          EXTEND="$ROOT/ruff.toml"
        elif [ -f "$ROOT/pyproject.toml" ]; then
          EXTEND="$ROOT/pyproject.toml"
        fi
        if [ -n "$EXTEND" ]; then
          cat > "$TMP/ruff-qaas.toml" <<EOF
        extend = "${EXTEND}"
        [lint]
        select = ["E", "F", "D"]
        [lint.pydocstyle]
        convention = "${CONV}"
        EOF
        else
          cat > "$TMP/ruff-qaas.toml" <<EOF
        line-length = 88
        [lint]
        select = ["E", "F", "D"]
        [lint.pydocstyle]
        convention = "${CONV}"
        EOF
        fi
    - name: Export docstring style for later steps
      shell: bash
      env:
        INPUT_DOCSTRING_FORMAT: ${{ inputs.docstring-format }}
      run: |
        set -euo pipefail
        case "$INPUT_DOCSTRING_FORMAT" in
          Google|google) echo "PYDOCLINT_FLAGS=--style=google" >> "$GITHUB_ENV" ;;
          Numpy|numpy) echo "PYDOCLINT_FLAGS=--style=numpy" >> "$GITHUB_ENV" ;;
          Pep257|pep257) echo "PYDOCLINT_FLAGS=--style=sphinx" >> "$GITHUB_ENV" ;;
          *) echo "PYDOCLINT_FLAGS=--style=google" >> "$GITHUB_ENV" ;;
        esac
    - name: Run check and format verification
      shell: bash
      env:
        WS: ${{ inputs.workspace }}
        WD: ${{ inputs.working-directory }}
        OUT: ${{ inputs.quality-output-dir }}
        TMP: ${{ inputs.runner-temp }}
        GENERATED: ${{ inputs.generated-paths }}
      run: |-
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        cd "$WS/$WD"
        # scripts/** is the top-level tooling directory. A package named scripts is scanned.
        excludes=(--exclude .devops --exclude 'scripts/**')
        if [ -n "${GENERATED}" ]; then
          IFS=',' read -ra _gen_items <<<"${GENERATED}"
          for _gen in "${_gen_items[@]}"; do
            _gen="${_gen#"${_gen%%[![:space:]]*}"}"
            _gen="${_gen%"${_gen##*[![:space:]]}"}"
            _gen="${_gen#./}"
            _gen="${_gen%/}"
            if [ -z "${_gen}" ]; then
              continue
            fi
            case "${_gen}" in
              /*|*..*|*,*)
                echo "generated path must be a relative path: ${_gen}" >&2
                exit 1
                ;;
            esac
            excludes+=(--exclude "${_gen}")
          done
        fi
        ruff check . "${excludes[@]}" --config "$TMP/ruff-qaas.toml" --output-format=json > "$OUT/ruff.json" || true
        ruff format --check . "${excludes[@]}" > "$OUT/ruff_format.txt" 2>&1 || true
