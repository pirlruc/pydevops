name: Pinned dependency tooling setup
description: >
  Reads .github/dependencies/uv-version.txt and installs that release on the runner.
  Reference as ./.github/actions/install-uv here or ./.devops/.github/actions/install-uv
  from an application checkout.

inputs:
  enable-cache:
    description: Forwarded to astral-sh/setup-uv (string "true" / "false")
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - id: uv_version
      name: Read pinned installer version file
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../../dependencies/emit-uv-version.sh"
    - name: Install pinned dependency tooling
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ steps.uv_version.outputs.version }}
        enable-cache: ${{ inputs.enable-cache }}
