---
name: Secrets scan and static pattern analysis
description: >
  Shield phase: find leaked credentials, upload SARIF to GitHub code scanning, and
  enforce
  static rules on Python. Expects the application at workspace root and DevOps at
  devops-checkout-path.
inputs:
  workspace:
    description: Absolute path to application repository root (e.g. github.workspace)
    required: true
  quality-output-dir:
    description: Absolute path to quality-output directory
    required: true
  devops-checkout-path:
    description: Absolute path to the DevOps clone (…/workspace/.devops)
    required: true
runs:
  using: composite
  steps:
    - name: Install scanners and JSON tooling
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends jq
        GITLEAKS_VERSION="$(tr -d ' \n\r' < "${GITHUB_ACTION_PATH}/../../dependencies/gitleaks/version.txt")"
        GITLEAKS_SHA="$(tr -d ' \t\n\r' < "${GITHUB_ACTION_PATH}/../../dependencies/gitleaks/linux-amd64.sha256")"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$tmp/gitleaks.tgz"
        echo "${GITLEAKS_SHA}  $tmp/gitleaks.tgz" | sha256sum -c -
        sudo tar -xzf "$tmp/gitleaks.tgz" -C /usr/local/bin gitleaks
    - name: Write secret scan report files
      # PY-SEC-003 — secret scanning in CI.
      shell: bash
      env:
        OUT: ${{ inputs.quality-output-dir }}
        WS: ${{ inputs.workspace }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        cd "$WS"
        gitleaks detect --source . --no-banner --verbose --redact \
          --report-format json --report-path "$OUT/gitleaks.json" --exit-code 0
        gitleaks detect --source . --no-banner --verbose --redact \
          --report-format sarif --report-path "$OUT/gitleaks.sarif" --exit-code 0
    - name: Fail when secrets are reported
      shell: bash
      env:
        OUT: ${{ inputs.quality-output-dir }}
      run: |
        set -euo pipefail
        n=$(jq 'if . == null then 0 elif type == "array" then length else 0 end' "$OUT/gitleaks.json")
        if [ "${n:-0}" -gt 0 ]; then
          echo "::error::Gitleaks reported ${n} finding(s). See gitleaks.json in artifacts."
          exit 1
        fi
    - name: Upload secret scan SARIF results
      if: always()
      uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
      with:
        sarif_file: ${{ inputs.quality-output-dir }}/gitleaks.sarif
      continue-on-error: true
    - name: Install pattern scanner for Python
      shell: bash
      env:
        DEVOPS: ${{ inputs.devops-checkout-path }}
      run: |
        set -euo pipefail
        SPEC=$(grep -v '^#' "$DEVOPS/.github/dependencies/semgrep/requirements.txt" | head -1 | tr -d ' \n\r')
        sudo apt-get update && sudo apt-get install -y --no-install-recommends pipx
        pipx ensurepath
        pipx install "$SPEC"
    - name: Run Semgrep (SARIF; policy enforced later via quality gates)
      # PY-SEC-002 — SAST in CI (semgrep).
      continue-on-error: true
      shell: bash
      env:
        OUT: ${{ inputs.quality-output-dir }}
        WS: ${{ inputs.workspace }}
        DEVOPS: ${{ inputs.devops-checkout-path }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        cd "$WS"
        export PATH="$HOME/.local/bin:$PATH"
        semgrep scan --config p/python \
          --config "$DEVOPS/.github/config/semgrep/python-custom.yml" \
          --exclude .devops \
          --sarif --output "$OUT/semgrep.sarif" .
    - name: Upload pattern scan SARIF results
      if: always()
      uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
      with:
        sarif_file: ${{ inputs.quality-output-dir }}/semgrep.sarif
      continue-on-error: true
