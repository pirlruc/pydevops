# Org-default Dependabot (SC-DEP-001/002/003).
# Manifests under .github/dependencies/; Actions SHA pins in workflows.
# Cadence: docs/guardrails/supply-chain/profile.thresholds.yml
# Process: https://github.com/pirlruc/methodologies/blob/main/github-issue-adr/docs/process/dependency-updates.md
#
# Personal-account private git (Dependabot secrets — not Actions):
#   DEPENDABOT_GITHUB_TOKEN — Contents: Read on private submodules
#     (github-scaffold, guardrails) and reusable-workflow hosts (commondevops).
#   DOCKERHUB_* — unused here (no docker ecosystem); keep as Dependabot secrets
#     if a docker entry is added later.

version: 2

registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  # github-private only on ecosystems that clone private git (reusable workflows
  # and submodules). Attaching it to pip fails graph updates with
  # unexpected_external_code (reject-external-code).
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
    registries:
      - github-private

  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pip
    directory: /.github/dependencies/dast-python
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pip
    directory: /.github/dependencies/semgrep
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pip
    directory: /.github/dependencies/zizmor
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pip
    directory: /.github/dependencies/mutmut
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: npm
    directory: /.github/dependencies/jscpd
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

