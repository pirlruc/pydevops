---
# zizmor policy (load with: zizmor -c .github/config/zizmor.yml ...).
# Workflow uses: lines are full SHAs (CI-001). zizmor scans .github/workflows only.
rules:
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  # Optional caller PAT for fork PR comments falls back to github.token; reusable-workflow consumers
  # are not required to define a GitHub Environment for this single secret reference.
  secrets-outside-env:
    ignore: [python-quality.yml]
  # zizmor 1.30 flags uses: ./... (self-repository).
  # Replacement is uses: $/... ; actionlint in this repo still rejects that form
  # (rhysd/actionlint#732 unreleased). Keep ./ until then.
  self-repository:
    ignore:
      - devops-ci.yml
      - devops-scheduled.yml
      - publish-pypi.yml
      - python-quality.yml
