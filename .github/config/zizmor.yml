# zizmor policy (load with: zizmor -c .github/config/zizmor.yml ...).
# Ref-pinning (tags like @v4) is required; full SHA pinning can be layered via pinact/frizbee + Dependabot.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  # Optional caller PAT for fork PR comments falls back to github.token; reusable-workflow consumers
  # are not required to define a GitHub Environment for this single secret reference.
  secrets-outside-env:
    ignore:
      - python-quality.yml
