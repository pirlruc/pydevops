name: Common supply-chain (optional thin caller)

# Optional license+SBOM path via pirlruc/commondevops. Primary quality remains
# python-quality.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      license_deny_list:
        required: false
        type: string
        default: "[]"
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      license_deny_list:
        type: string
        default: "[]"

# CI-025
permissions: {}

jobs:
  supply-chain:
    # CI-024
    if: github.actor != 'dependabot[bot]'
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@75d0fafc90fbef7bb118025437502ca2cf42a11e
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      license_deny_list: ${{ inputs.license_deny_list }}
      scripts_ref: 75d0fafc90fbef7bb118025437502ca2cf42a11e
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
