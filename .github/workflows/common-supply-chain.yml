name: Common supply-chain (optional thin caller)

# Optional license+SBOM path via pirlruc/commondevops. Primary quality remains
# python-quality.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      license_deny_list:
        required: false
        type: string
        default: "[]"
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      license_deny_list:
        type: string
        default: "[]"

# CI-025
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  supply-chain:
    # CI-024
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@c8ab7171a3897bddc58e3fd8c508529ca9803571
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      license_deny_list: ${{ inputs.license_deny_list }}
      scripts_ref: c8ab7171a3897bddc58e3fd8c508529ca9803571
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:b43eb3a99bc4c2003eb64ef5d6d0cdcbbc22d78904aa6b24d76ad0426035a7f6
