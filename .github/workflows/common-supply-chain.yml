name: Common supply-chain (optional thin caller)

# Optional license+SBOM path via pirlruc/commondevops. Primary quality remains
# python-quality.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      license_deny_list:
        required: false
        type: string
        default: '["AGPL-3.0", "SSPL-1.0", "BUSL-1.1", "Commons-Clause", "CC-BY-NC"]'
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      license_deny_list:
        type: string
        default: '["AGPL-3.0", "SSPL-1.0", "BUSL-1.1", "Commons-Clause", "CC-BY-NC"]'

# CI-025
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  supply-chain:
    # CI-024
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      license_deny_list: ${{ inputs.license_deny_list }}
      scripts_ref: 2c5e1ebe9797828128e01f3941b5a02650abe59a
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
