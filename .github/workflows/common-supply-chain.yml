name: Common supply-chain (optional thin caller)

# Optional license+SBOM path via pirlruc/commondevops. Primary quality remains
# python-quality.yml. Pin matches scripts_ref (CI-018).

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
      working_directory:
        required: false
        type: string
        default: .
      license_deny_list:
        required: false
        type: string
        default: "[]"
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      license_deny_list:
        type: string
        default: "[]"

# CI-025
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  supply-chain:
    # CI-024
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@0b37bd52212bbe0d6eac70f955203d7582dfd9da
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      license_deny_list: ${{ inputs.license_deny_list }}
      scripts_ref: 0b37bd52212bbe0d6eac70f955203d7582dfd9da
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
