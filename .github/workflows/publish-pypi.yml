---
name: Publish to PyPI
# Manual publish for this repository or for callers that copy this workflow pattern.
# Application repos should use their own trusted-publish workflow; tag-driven PyPI
# publishing was moved off automatic tag push to require explicit approval.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish (e.g. v0.1.0)
        required: true
        type: string
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions: {}
jobs:
  publish:
    if: github.actor != 'dependabot[bot]'
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z (received: ${TAG})" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${TAG}"
          git checkout --detach "refs/tags/${TAG}"
      - name: Install tooling without local cache
        uses: ./.github/actions/install-uv
        with:
          enable-cache: 'false'
      - name: Build wheel and source distribution
        run: uv build
      - name: Publish with trusted registry OIDC
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          attestations: true
          packages-dir: dist/
