---
name: Python Quality (Reusable)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QUALITY_OUTPUT_DIR: ${{ github.workspace }}/quality-output
on:
  workflow_call:
    inputs:
      strictness_level:
        description: Low, Medium, or High gate thresholds
        type: string
        default: Medium
      docstring_format:
        description: >
          Google, Numpy, or Pep257 for Ruff pydocstyle. Pep257 selects pydoclint --style=sphinx
          (pydoclint has no pep257; avoids conflicting Google-style checks with Ruff
          pep257).
        type: string
        default: Google
      enable_dast:
        description: Run OWASP ZAP + Locust via docker compose
        type: boolean
        default: false
      license_deny_list:
        description: JSON array of license substrings to forbid (SPDX SBOM), e.g.
          ["GPL-3.0"]
        type: string
        default: '[]'
      devops_repository:
        description: >
          Optional override for DevOps owner/name. Empty: parse from github.workflow_ref
          (same repo/ref as the reusable workflow definition) or fall back to github.repository.
        type: string
        default: ''
        required: false
      devops_ref:
        description: >
          Optional override for DevOps git ref. Empty: parse from github.workflow_ref
          or use
          github.ref_name. Prefer an immutable tag or SHA in production.
        type: string
        default: ''
        required: false
      working_directory:
        description: App subdirectory containing pyproject / package
        type: string
        default: .
      python_version:
        description: Python version for uv
        type: string
        default: '3.13'
      app_install_command:
        description: Install app deps before tests (empty to skip)
        type: string
        default: if [ -f pyproject.toml ]; then uv sync --all-groups --all-extras;
          elif [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
      docker_compose_file:
        description: Compose file for DAST (relative to app root)
        type: string
        default: docker-compose.yml
      dast_target_url:
        description: Base URL for OWASP ZAP (app must listen in compose)
        type: string
        default: http://localhost:8080
    secrets:
      caller_pat:
        description: Optional PAT from caller for PR comments / forks
        required: false
    outputs:
      gates_passed:
        description: True when license and full quality gate enforcement succeeded
        value: ${{ jobs.quality-report.outputs.gates_passed }}
  workflow_dispatch:
    inputs:
      strictness_level:
        type: choice
        options: [Low, Medium, High]
        default: Medium
      docstring_format:
        description: >
          Google, Numpy, or Pep257 for Ruff pydocstyle. Pep257 uses pydoclint --style=sphinx.
        type: choice
        options: [Google, Numpy, Pep257]
        default: Google
      enable_dast:
        type: boolean
        default: false
      license_deny_list:
        type: string
        default: '[]'
      devops_repository:
        description: >
          Optional DevOps owner/name. Empty: same resolution as workflow_call — parse
          from
          github.workflow_ref (repo that defines this reusable workflow) or fall back
          to
          github.repository.
        type: string
        default: ''
      devops_ref:
        description: >
          Optional DevOps git ref. Empty: parse from github.workflow_ref or use github.ref_name
          (same as workflow_call). Prefer an immutable tag or SHA in production.
        type: string
        default: ''
      working_directory:
        type: string
        default: .
      python_version:
        type: string
        default: '3.13'
      docker_compose_file:
        type: string
        default: docker-compose.yml
      dast_target_url:
        type: string
        default: http://localhost:8080
permissions: {}
jobs:
  devops-coordinates:
    name: Resolve DevOps checkout (workflow ref or inputs)
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.calc.outputs.repository }}
      ref: ${{ steps.calc.outputs.ref }}
    steps:
      - id: calc
        shell: bash
        env:
          INPUT_DEVOPS_REPO: ${{ inputs.devops_repository }}
          INPUT_DEVOPS_REF: ${{ inputs.devops_ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="${INPUT_DEVOPS_REPO:-}"
          ref="${INPUT_DEVOPS_REF:-}"
          wf="${GITHUB_WORKFLOW_REF:-}"
          auto_repo=""
          auto_ref=""
          if [[ -n "${wf}" && "${wf}" == *"@"* ]]; then
            base="${wf%@*}"
            auto_ref="${wf##*@}"
            auto_repo="${base%/.github/*}"
          fi
          if [ -z "${repo}" ]; then
            repo="${auto_repo:-}"
          fi
          if [ -z "${ref}" ]; then
            ref="${auto_ref:-}"
          fi
          if [ -z "${repo}" ]; then
            repo="${GITHUB_REPOSITORY}"
          fi
          if [ -z "${ref}" ]; then
            ref="${GITHUB_REF_NAME}"
          fi
          echo "repository=${repo}" >> "${GITHUB_OUTPUT}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
  quality-shield:
    name: Job 1 — Shield (secrets + Semgrep SARIF)
    needs: devops-coordinates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out application full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out DevOps into workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.devops-coordinates.outputs.repository }}
          ref: ${{ needs.devops-coordinates.outputs.ref }}
          path: .devops
          persist-credentials: false
      - name: Create quality output directory
        run: mkdir -p "$QUALITY_OUTPUT_DIR"
      - name: Scan secrets and static patterns
        uses: ./.devops/.github/actions/qa-secrets-sast
        with:
          workspace: ${{ github.workspace }}
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          devops-checkout-path: ${{ github.workspace }}/.devops
      - name: Install uv and Python for quality gate CLI
        uses: ./.devops/.github/actions/setup-uv-python
        with:
          python-version: ${{ inputs.python_version }}
          working-directory: .
      - name: Sync DevOps dependencies (quality gates)
        env:
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
        run: uv sync --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}"
      - name: Enforce Semgrep SARIF policy (High only; Low/Medium no-op)
        env:
          STRICTNESS_LEVEL: ${{ inputs.strictness_level }}
          QUALITY_OUTPUT_DIR: ${{ env.QUALITY_OUTPUT_DIR }}
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
        run: |
          uv run --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}" \
            python -m scripts.quality_gates --semgrep-shield-only
      - name: Upload shield artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-shield-artifacts
          path: ${{ env.QUALITY_OUTPUT_DIR }}/
  quality-static:
    name: Job 2 — Static analysis (Gatekeeper)
    needs: [devops-coordinates, quality-shield]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out DevOps into workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.devops-coordinates.outputs.repository }}
          ref: ${{ needs.devops-coordinates.outputs.ref }}
          path: .devops
          persist-credentials: false
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-qa-uv-${{ hashFiles('.devops/uv.lock', format('{0}/uv.lock',
            inputs.working_directory), format('{0}/pyproject.toml', inputs.working_directory))
            }}
          restore-keys: |
            ${{ runner.os }}-qa-uv-
      - name: Prepare runner quality toolchain
        uses: ./.devops/.github/actions/qa-install-toolchain
        with:
          workspace: ${{ github.workspace }}
          devops-checkout-path: ${{ github.workspace }}/.devops
          working-directory: ${{ inputs.working_directory }}
          python-version: ${{ inputs.python_version }}
      - name: Create quality output directory
        run: mkdir -p "$QUALITY_OUTPUT_DIR"
      - name: Install app and run style checks
        uses: ./.devops/.github/actions/qa-app-install-and-ruff
        with:
          workspace: ${{ github.workspace }}
          working-directory: ${{ inputs.working_directory }}
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          runner-temp: ${{ runner.temp }}
          docstring-format: ${{ inputs.docstring_format }}
          github-event-name: ${{ github.event_name }}
          app-install-command: ${{ inputs.app_install_command || '' }}
      - name: Run static analysis quality phase
        uses: ./.devops/.github/actions/qa-run-quality-phase
        with:
          phase: static
          workspace: ${{ github.workspace }}
          working-directory: ${{ inputs.working_directory }}
          devops-checkout-path: ${{ github.workspace }}/.devops
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          strictness-level: ${{ inputs.strictness_level }}
      - name: Upload static analysis artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-static-artifacts
          path: ${{ env.QUALITY_OUTPUT_DIR }}/
  quality-supply-chain:
    name: Job 3 — Supply chain & SBOM
    needs: [devops-coordinates, quality-shield]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out DevOps into workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.devops-coordinates.outputs.repository }}
          ref: ${{ needs.devops-coordinates.outputs.ref }}
          path: .devops
          persist-credentials: false
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-qa-uv-${{ hashFiles('.devops/uv.lock', format('{0}/uv.lock',
            inputs.working_directory), format('{0}/pyproject.toml', inputs.working_directory))
            }}
          restore-keys: |
            ${{ runner.os }}-qa-uv-
      - name: Prepare runner quality toolchain
        uses: ./.devops/.github/actions/qa-install-toolchain
        with:
          workspace: ${{ github.workspace }}
          devops-checkout-path: ${{ github.workspace }}/.devops
          working-directory: ${{ inputs.working_directory }}
          python-version: ${{ inputs.python_version }}
      - name: Create quality output directory
        run: mkdir -p "$QUALITY_OUTPUT_DIR"
      - name: Install app and run style checks
        uses: ./.devops/.github/actions/qa-app-install-and-ruff
        with:
          workspace: ${{ github.workspace }}
          working-directory: ${{ inputs.working_directory }}
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          runner-temp: ${{ runner.temp }}
          docstring-format: ${{ inputs.docstring_format }}
          github-event-name: ${{ github.event_name }}
          app-install-command: ${{ inputs.app_install_command || '' }}
      - name: Run security quality phase
        uses: ./.devops/.github/actions/qa-run-quality-phase
        with:
          phase: security
          workspace: ${{ github.workspace }}
          working-directory: ${{ inputs.working_directory }}
          devops-checkout-path: ${{ github.workspace }}/.devops
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          strictness-level: ${{ inputs.strictness_level }}
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-security-artifacts
          path: ${{ env.QUALITY_OUTPUT_DIR }}/
  quality-test:
    name: Job 4 — Tests & coverage
    needs: [devops-coordinates, quality-static]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out DevOps into workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.devops-coordinates.outputs.repository }}
          ref: ${{ needs.devops-coordinates.outputs.ref }}
          path: .devops
          persist-credentials: false
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-qa-uv-${{ hashFiles('.devops/uv.lock', format('{0}/uv.lock',
            inputs.working_directory), format('{0}/pyproject.toml', inputs.working_directory))
            }}
          restore-keys: |
            ${{ runner.os }}-qa-uv-
      - name: Prepare runner quality toolchain
        uses: ./.devops/.github/actions/qa-install-toolchain
        with:
          workspace: ${{ github.workspace }}
          devops-checkout-path: ${{ github.workspace }}/.devops
          working-directory: ${{ inputs.working_directory }}
          python-version: ${{ inputs.python_version }}
      - name: Create quality output directory
        run: mkdir -p "$QUALITY_OUTPUT_DIR"
      - name: Install app and run style checks
        uses: ./.devops/.github/actions/qa-app-install-and-ruff
        with:
          workspace: ${{ github.workspace }}
          working-directory: ${{ inputs.working_directory }}
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          runner-temp: ${{ runner.temp }}
          docstring-format: ${{ inputs.docstring_format }}
          github-event-name: ${{ github.event_name }}
          app-install-command: ${{ inputs.app_install_command || '' }}
      - name: Run test quality phase
        uses: ./.devops/.github/actions/qa-run-quality-phase
        with:
          phase: test
          workspace: ${{ github.workspace }}
          working-directory: ${{ inputs.working_directory }}
          devops-checkout-path: ${{ github.workspace }}/.devops
          quality-output-dir: ${{ env.QUALITY_OUTPUT_DIR }}
          strictness-level: ${{ inputs.strictness_level }}
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-test-artifacts
          path: ${{ env.QUALITY_OUTPUT_DIR }}/
  quality-report:
    name: Job 5 — Reporting & artifacts
    needs:
      - devops-coordinates
      - quality-static
      - quality-supply-chain
      - quality-test
    if: always()
    runs-on: ubuntu-latest
    outputs:
      gates_passed: ${{ steps.gates-out.outputs.passed }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out DevOps into workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.devops-coordinates.outputs.repository }}
          ref: ${{ needs.devops-coordinates.outputs.ref }}
          path: .devops
          persist-credentials: false
      - name: Install uv and Python for reporting scripts
        uses: ./.devops/.github/actions/setup-uv-python
        with:
          python-version: ${{ inputs.python_version }}
          working-directory: .
      - name: Sync DevOps dependencies
        env:
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
        run: uv sync --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}"
      - name: Create merged quality output directory
        run: mkdir -p "$QUALITY_OUTPUT_DIR"
      - name: Download shield artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-shield-artifacts
          path: _merge/shield
      - name: Download static artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-static-artifacts
          path: _merge/static
      - name: Download supply-chain artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-security-artifacts
          path: _merge/security
      - name: Download test artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-test-artifacts
          path: _merge/test
      - name: Merge downloaded artifacts
        run: |
          set -euo pipefail
          for d in _merge/shield _merge/static _merge/security _merge/test; do
            if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null || true)" ]; then
              cp -a "$d"/. "$QUALITY_OUTPUT_DIR"/
            fi
          done
      - id: license
        name: Enforce license policy on SBOM
        continue-on-error: true
        env:
          SPDX_SBOM_PATH: ${{ env.QUALITY_OUTPUT_DIR }}/sbom-spdx.json
          LICENSE_DENY_LIST: ${{ inputs.license_deny_list }}
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
        run: |
          uv run --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}" \
            python scripts/license_gate.py
      - id: evaluate-gates
        name: Evaluate configured quality gates
        continue-on-error: true
        env:
          STRICTNESS_LEVEL: ${{ inputs.strictness_level }}
          QUALITY_OUTPUT_DIR: ${{ env.QUALITY_OUTPUT_DIR }}
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
        run: |
          uv run --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}" \
            python -m scripts.quality_gates
      - name: Consolidate quality output files
        if: always()
        env:
          QUALITY_OUTPUT_DIR: ${{ env.QUALITY_OUTPUT_DIR }}
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
        run: |
          uv run --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}" \
            python scripts/consolidate_artifacts.py
      - name: Upload quality bundle artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-bundle
          path: ${{ env.QUALITY_OUTPUT_DIR }}/
      - name: Build release distributions (tag runs)
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_type == 'tag'
        working-directory: ${{ inputs.working_directory }}
        run: uv build
      - name: Upload release distributions
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: ${{ format('{0}/dist', inputs.working_directory) }}
      - name: Render pull request comment body
        if: always() && github.event_name == 'pull_request'
        env:
          QUALITY_OUTPUT_DIR: ${{ env.QUALITY_OUTPUT_DIR }}
          UV_PYTHON: ${{ inputs.python_version }}
          DEVOPS_ROOT: ${{ github.workspace }}/.devops
          COMMENT_FILE: ${{ github.workspace }}/quality-pr-comment.md
        run: |
          uv run --python "${UV_PYTHON}" --directory "${DEVOPS_ROOT}" \
            python scripts/pr_comment_markdown.py > "${COMMENT_FILE}"
      - name: Upload comment body for later job
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name
          == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-quality-comment
          path: quality-pr-comment.md
          if-no-files-found: ignore
      - id: gates-out
        name: Record gate outcome for workflow outputs
        if: always()
        env:
          LICENSE_OUTCOME: ${{ steps.license.outcome }}
          EVALUATE_GATES_OUTCOME: ${{ steps.evaluate-gates.outcome }}
        run: |
          set -euo pipefail
          lic="${LICENSE_OUTCOME}"
          ev="${EVALUATE_GATES_OUTCOME}"
          if [ "$lic" = "success" ] && [ "$ev" = "success" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce license and quality gates on job status
        if: always()
        env:
          LICENSE_OUTCOME: ${{ steps.license.outcome }}
          EVALUATE_GATES_OUTCOME: ${{ steps.evaluate-gates.outcome }}
        run: |
          set -euo pipefail
          if [ "${LICENSE_OUTCOME}" != "success" ] || [ "${EVALUATE_GATES_OUTCOME}" != "success" ]; then
            echo "::error::License policy and/or quality gates failed (see logs and quality-bundle artifact)."
            exit 1
          fi
  pr-quality-comment:
    name: Post quality summary on PR
    needs: quality-report
    # CI-024: may use caller_pat Actions secret
    if: >
      always() && github.actor != 'dependabot[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Download staged comment artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: pr-quality-comment
      - name: Post quality summary comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.caller_pat || github.token }}
          script: |
            const fs = require('fs');
            const path = 'quality-pr-comment.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
  quality-dast:
    name: Dynamic analysis (ZAP + Locust)
    if: ${{ inputs.enable_dast == true }}
    needs: [devops-coordinates, quality-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out DevOps into workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.devops-coordinates.outputs.repository }}
          ref: ${{ needs.devops-coordinates.outputs.ref }}
          path: .devops
          persist-credentials: false
      - name: Install pinned package tooling
        uses: ./.devops/.github/actions/install-uv
      - name: Create dynamic test output directory
        run: mkdir -p "${{ github.workspace }}/quality-output"
      - name: Start stack and run load smoke
        working-directory: ${{ inputs.working_directory }}
        env:
          COMPOSE_FILE: ${{ inputs.docker_compose_file }}
          DAST_TARGET_URL: ${{ inputs.dast_target_url }}
        run: |
          docker compose -f "$COMPOSE_FILE" up -d --build
          sleep 15
          LOCUST_SPEC=$(grep -v '^#' "${{ github.workspace }}/.devops/.github/dependencies/dast-python/requirements.txt" | head -1 | tr -d ' \n\r')
          uv tool install "${LOCUST_SPEC}"
          export PATH="$HOME/.local/bin:$PATH"
          if [ -f locustfile.py ]; then
            locust -f locustfile.py --headless -u 5 -r 1 -t 30s --host "$DAST_TARGET_URL" \
              --html "${{ github.workspace }}/quality-output/locust_report.html" || true
          else
            echo "No locustfile.py; skipping Locust." > "${{ github.workspace }}/quality-output/locust_skip.txt"
          fi
      - name: Run baseline web security scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.dast_target_url }}
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          allow_issue_writing: false
      - name: Copy scan report into bundle
        if: always()
        run: |
          if [ -f report_html.html ]; then
            cp report_html.html "${{ github.workspace }}/quality-output/zap_report.html" || true
          fi
      - name: Tear down compose stack
        if: always()
        working-directory: ${{ inputs.working_directory }}
        env:
          COMPOSE_FILE: ${{ inputs.docker_compose_file }}
        run: docker compose -f "$COMPOSE_FILE" down -v || true
      - name: Upload dynamic test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dast-reports
          path: |
            report_html.html
            quality-output
  release-github:
    name: Create GitHub release (dist + quality bundle)
    runs-on: ubuntu-latest
    needs:
      - quality-supply-chain
      - quality-test
      - quality-report
      - quality-dast
    if: |
      always() &&
      needs.quality-report.outputs.gates_passed == 'true' &&
      needs.quality-supply-chain.result == 'success' &&
      needs.quality-test.result == 'success' &&
      needs.quality-report.result == 'success' &&
      (needs.quality-dast.result == 'success' || needs.quality-dast.result == 'skipped') &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.ref_type == 'tag'
    environment: production
    permissions:
      contents: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Expressions have no regex — strict vMAJOR.MINOR.PATCH (digits only) is enforced here.
      - name: Require SemVer tag vX.Y.Z
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release requires tag vMAJOR.MINOR.PATCH (numeric only; no prerelease suffix)."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download quality bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-bundle
          path: bundle
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist
      - name: Create release with dist and quality bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          dists=(dist/*)
          if [ "${#dists[@]}" -eq 0 ]; then
            echo "::error::No built distributions found in dist/."
            exit 1
          fi
          (cd bundle && zip -r "${{ github.workspace }}/quality-bundle-${tag}.zip" .)
          gh release create "$tag" "${dists[@]}" "${{ github.workspace }}/quality-bundle-${tag}.zip" --generate-notes --title "$tag"
