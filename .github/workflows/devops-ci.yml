---
# Consolidated CI (manual): three lanes (separate jobs):
#   1) Workflow static analysis — commondevops common-infra-lint.yml (actionlint + zizmor).
#   2) Python scripts quality — pytest, pylint, interrogate, Radon CC/MI (one job: one uv sync).
#   3) Supply chain — commondevops common-scorecard.yml.
# workflow_dispatch only to conserve GitHub Actions minutes; Dependabot remains the sole auto trigger.
name: DevOps CI
# Prefer Node 24 for JavaScript actions until all upstream actions ship node24 runtimes.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # Workflow-level permissions: {} — explicit read for checkout + paths-filter on PRs.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scripts: ${{ steps.flags.outputs.scripts }}
      workflows: ${{ steps.flags.outputs.workflows }}
    steps:
      - name: Check out repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            scripts:
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            workflows:
              - '.github/**'
              - 'examples/**'
              - 'docs/**'
      - name: Expose path flags
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_SCRIPTS: ${{ steps.filter.outputs.scripts }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=${FILTER_SCRIPTS}" >> "$GITHUB_OUTPUT"
            echo "workflows=${FILTER_WORKFLOWS}" >> "$GITHUB_OUTPUT"
          fi
  ci-workflow-lint:
    name: CI — workflow lint (actionlint + zizmor)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows
      == 'true'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
      blocking: true
    secrets:
      # Optional. Unset COMMONDEVOPS_READ_TOKEN is empty and the reusable falls
      # back to github.token. Set the secret (contents:read on pirlruc/commondevops)
      # if private script checkout fails.
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
  ci-supply-chain:
    name: CI — supply chain (Scorecard)
    needs: changes
    # CI-024: Scorecard needs id-token / security-events
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows
      == 'true') &&
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: true
      publish_results: true

  ci-scripts:
    name: CI — scripts (pytest, pylint, interrogate, Radon)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.scripts
      == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned package tooling and Python
        uses: ./.github/actions/setup-uv-python
        with:
          python-version: '3.13'
          uv-cache-suffix: ${{ github.job }}
      - name: Sync dependencies from lockfile
        run: uv sync
      - name: Verify pin manifests (pyproject ↔ quality-tools, Actions JSON ↔ workflows)
        run: |
          set -euo pipefail
          python3 scripts/export_quality_tools_requirements.py
          git diff --exit-code -- .github/dependencies/quality-tools/requirements.txt
          python3 scripts/github_actions_pins.py --check
      - name: Prepare log capture for job summary
        run: mkdir -p _ci_summary
      - id: pytest
        name: Run automated test suite
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest 2>&1 | tee _ci_summary/pytest.txt
      - id: pylint
        name: Lint scripts directory
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pylint scripts 2>&1 | tee _ci_summary/pylint.txt
      - id: docstrings
        name: Check docstring coverage on scripts
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          uv run interrogate scripts -vv --fail-under 95 2>&1 | tee _ci_summary/interrogate.txt
      - id: radon_cc
        name: Enforce complexity limits on gates
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          uv run python << 'PY' | tee _ci_summary/radon_cc.txt
          import json
          import subprocess
          import sys
          from pathlib import Path
          root = Path("scripts/quality_gates")
          py_files = sorted(p.name for p in root.glob("*.py"))
          print("Radon CC — scope: scripts/quality_gates/*.py")
          print(f"Modules scanned ({len(py_files)}): {', '.join(py_files)}")
          print()
          raw = subprocess.check_output(
              ["uv", "run", "radon", "cc", "-j", str(root)],
              text=True,
          )
          data = json.loads(raw)
          rows: list[tuple[str, float, int]] = []
          overall_max = 0.0
          for path in sorted(data.keys()):
              blocks = data[path]
              if not isinstance(blocks, list):
                  continue
              max_c = 0.0
              n = 0
              for b in blocks:
                  if isinstance(b, dict) and "complexity" in b:
                      max_c = max(max_c, float(b["complexity"]))
                      n += 1
              if n:
                  rel = str(Path(path).as_posix())
                  rows.append((rel, max_c, n))
                  overall_max = max(overall_max, max_c)
          print(f"{'File':<48} {'Max CC':>8}  {'Blocks':>8}")
          print("-" * 68)
          for rel, max_c, n in rows:
              print(f"{rel:<48} {max_c:>8.1f}  {n:>8d}")
          print("-" * 68)
          print(f"{'Overall max CC (across files)':<48} {overall_max:>8.1f}  (limit ≤ 5.0)")
          if overall_max > 5:
              print(f"FAIL: max cyclomatic complexity {overall_max} exceeds 5", file=sys.stderr)
              sys.exit(1)
          print("PASS: cyclomatic complexity within limit.")
          PY
      - id: radon_mi
        name: Enforce maintainability floor on gates
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          uv run python << 'PY' | tee _ci_summary/radon_mi.txt
          import json
          import subprocess
          import sys
          from pathlib import Path
          root = Path("scripts/quality_gates")
          files = sorted(root.glob("*.py"))
          paths = [str(p) for p in files]
          print("Radon MI — scope: scripts/quality_gates/*.py")
          print(f"Modules scanned ({len(paths)}): {', '.join(p.name for p in files)}")
          print()
          raw = subprocess.check_output(["uv", "run", "radon", "mi", "-j", *paths], text=True)
          data = json.loads(raw)
          floor = 40.0
          rows: list[tuple[str, float, str]] = []
          for path in sorted(data.keys()):
              meta = data[path]
              if not isinstance(meta, dict):
                  continue
              mi = float(meta.get("mi", 0.0))
              rnk = meta.get("rank", "?")
              rnk_s = rnk if isinstance(rnk, str) else "?"
              rows.append((str(Path(path).as_posix()), mi, rnk_s))
          print(f"{'File':<48} {'MI':>10}  {'Rank':>6}")
          print("-" * 70)
          for rel, mi, rnk_s in rows:
              print(f"{rel:<48} {mi:>10.2f}  {rnk_s:>6}")
          print("-" * 70)
          mins = min((mi for _, mi, _ in rows), default=0.0)
          print(f"{'Minimum MI (worst file)':<48} {mins:>10.2f}  (must be > {floor})")
          bad = [(rel, mi) for rel, mi, _ in rows if mi <= floor]
          if bad:
              for rel, mi in bad:
                  print(f"FAIL: {rel}: MI {mi:.2f} (must be > {floor})", file=sys.stderr)
              sys.exit(1)
          print("PASS: maintainability index above floor for all files.")
          PY
      - id: pip_audit
        name: Audit Python dependencies (pip-audit)
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pip-audit --format=json > _ci_summary/pip_audit.json 2> _ci_summary/pip_audit.stderr || true
          uv run python << 'PY' | tee _ci_summary/pip_audit.txt
          import json
          import re
          import sys
          from pathlib import Path
          payload = []
          p = Path("_ci_summary/pip_audit.json")
          try:
              payload = json.loads(p.read_text(encoding="utf-8", errors="replace"))
          except (json.JSONDecodeError, OSError):
              print("PIP-AUDIT SUMMARY: total=0 low=0 medium=0 high=0 critical=0 unknown=0")
              print("FAIL: pip-audit did not produce parseable JSON output.", file=sys.stderr)
              sys.exit(1)
          rows = payload if isinstance(payload, list) else payload.get("dependencies", [])
          if not isinstance(rows, list):
              rows = []
          sev_counts = {"low": 0, "medium": 0, "high": 0, "critical": 0, "unknown": 0}
          sev_levels = tuple(sev_counts.keys())
          def bucket(v):
              if not isinstance(v, str):
                  return None
              s = v.strip().lower()
              if s in sev_levels:
                  return s
              if re.fullmatch(r"cvssv?3?:(none|low|medium|high|critical)", s):
                  return s.rsplit(":", 1)[-1]
              return None
          def from_osv(vuln):
              if not isinstance(vuln, dict):
                  return []
              out = []
              aliases = vuln.get("aliases")
              if not isinstance(aliases, list):
                  return out
              for a in aliases:
                  if not isinstance(a, str):
                      continue
                  m = re.search(r"\b(CRITICAL|HIGH|MEDIUM|LOW)\b", a, re.IGNORECASE)
                  if m:
                      out.append(m.group(1).lower())
              return out
          total = 0
          findings = []
          for dep in rows:
              if not isinstance(dep, dict):
                  continue
              pkg = dep.get("name") if isinstance(dep.get("name"), str) else "unknown-package"
              ver = dep.get("version") if isinstance(dep.get("version"), str) else "?"
              vulns = dep.get("vulns")
              if not isinstance(vulns, list):
                  continue
              for vuln in vulns:
                  total += 1
                  seen = set()
                  vuln_id = "unknown-vuln"
                  fix_versions = []
                  if isinstance(vuln, dict):
                      if isinstance(vuln.get("id"), str):
                          vuln_id = vuln["id"]
                      fx = vuln.get("fix_versions")
                      if isinstance(fx, list):
                          fix_versions = [str(x) for x in fx if isinstance(x, (str, int, float))]
                      for key in ("severity", "severity_level"):
                          b = bucket(vuln.get(key))
                          if b:
                              seen.add(b)
                      sev = vuln.get("severities")
                      if isinstance(sev, list):
                          for entry in sev:
                              if isinstance(entry, dict):
                                  b = bucket(entry.get("severity"))
                                  if b:
                                      seen.add(b)
                              else:
                                  b = bucket(entry)
                                  if b:
                                      seen.add(b)
                      for b in from_osv(vuln):
                          seen.add(b)
                  if not seen:
                      sev_label = "unknown"
                      sev_counts["unknown"] += 1
                  else:
                      sev_label = ",".join(sorted(seen))
                      for b in seen:
                          sev_counts[b] += 1
                  fix_txt = ", ".join(fix_versions) if fix_versions else "none-reported"
                  findings.append((pkg, ver, vuln_id, sev_label, fix_txt))
          print(
              "PIP-AUDIT SUMMARY: "
              f"total={total} low={sev_counts['low']} medium={sev_counts['medium']} "
              f"high={sev_counts['high']} critical={sev_counts['critical']} unknown={sev_counts['unknown']}"
          )
          if findings:
              print("PIP-AUDIT FINDINGS:")
              for pkg, ver, vuln_id, sev_label, fix_txt in findings:
                  print(
                      f" - package={pkg}@{ver} vuln={vuln_id} "
                      f"severity={sev_label} fix_versions={fix_txt}"
                  )
          else:
              print("PIP-AUDIT FINDINGS: none")
          if sev_counts["medium"] > 0 or sev_counts["high"] > 0 or sev_counts["critical"] > 0:
              print(
                  "FAIL: pip-audit found medium/high/critical vulnerabilities "
                  f"(M={sev_counts['medium']} H={sev_counts['high']} C={sev_counts['critical']}).",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("PASS: no medium/high/critical pip-audit vulnerabilities.")
          PY
      - name: Scripts quality — job summary
        if: always()
        run: uv run python scripts/ci_scripts_job_summary.py >> "${GITHUB_STEP_SUMMARY}"
      - name: Gate — scripts job
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          PYLINT_OUTCOME: ${{ steps.pylint.outcome }}
          DOCSTRINGS_OUTCOME: ${{ steps.docstrings.outcome }}
          RADON_CC_OUTCOME: ${{ steps.radon_cc.outcome }}
          RADON_MI_OUTCOME: ${{ steps.radon_mi.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
        run: |-
          set -euo pipefail
          failed=()
          if [ "${PYTEST_OUTCOME}" != "success" ]; then failed+=("pytest"); fi
          if [ "${PYLINT_OUTCOME}" != "success" ]; then failed+=("pylint"); fi
          if [ "${DOCSTRINGS_OUTCOME}" != "success" ]; then failed+=("interrogate"); fi
          if [ "${RADON_CC_OUTCOME}" != "success" ]; then failed+=("Radon CC"); fi
          if [ "${RADON_MI_OUTCOME}" != "success" ]; then failed+=("Radon MI"); fi
          if [ "${PIP_AUDIT_OUTCOME}" != "success" ]; then failed+=("pip-audit"); fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Scripts quality failed: ${failed[*]} (see prior steps)."
            exit 1
          fi
          echo "Scripts job passed."
