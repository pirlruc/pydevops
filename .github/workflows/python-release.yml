name: Python GitHub Release (reusable)

# Build a sdist and a wheel, write a CycloneDX SBOM, attest the files, and
# attach them to the GitHub Release for an annotated tag. PyPI Trusted
# Publishing stays in the caller. A reusable workflow cannot be the publisher.

on:
  workflow_call:
    inputs:
      python_version:
        description: Python version for the build
        required: false
        type: string
        default: "3.13"
      working_directory:
        description: Directory that contains pyproject.toml
        required: false
        type: string
        default: .
  workflow_dispatch:
    inputs:
      python_version:
        type: string
        default: "3.13"
      working_directory:
        type: string
        default: .

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-py-release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/}"
          kind="$(git cat-file -t "refs/tags/${tag}")"
          test "${kind}" = "tag"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: false

      - name: Build distributions
        run: uv build

      - name: CycloneDX SBOM
        run: uv run --with cyclonedx-bom cyclonedx-py environment --output-file dist/sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ inputs.working_directory }}/dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ inputs.working_directory }}/dist/*
          generate_release_notes: true
