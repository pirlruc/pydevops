# -----------------------------------------------------------------------------
# Standalone workflow — NOT workflow_call / NOT reusable.
# Validates correctness and security posture of workflow and composite-action
# definitions in this repository (including the QaaS reusable workflows).
#
# Tools: StepSecurity Harden-Runner | actionlint | zizmor | OpenSSF Scorecard
# -----------------------------------------------------------------------------

name: Reusable workflows quality

on:
  pull_request:
    paths:
      - ".github/**"
      - "examples/**"
      - "docs/**"
  push:
    branches: [main, master]
    paths:
      - ".github/**"
      - "examples/**"
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  actionlint-zizmor:
    name: Lint workflows and scan for risks
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@v2.16.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and install workflow linter
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -sSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" | bash -s -- "${ACTIONLINT_VERSION}"
          sudo mv actionlint /usr/local/bin/

      - name: Lint workflow and action files
        run: |
          set -euo pipefail
          echo "actionlint — scanning workflow files under .github/workflows/"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort | sed 's/^/  /'
          echo "actionlint — scanning composite actions under .github/actions/**/action.y*ml"
          find .github/actions -type f \( -name 'action.yml' -o -name 'action.yaml' \) 2>/dev/null | sort | sed 's/^/  /' || true
          actionlint -color
          echo "actionlint: OK (no findings)."

      - name: Install workflow scanner from pins
        run: |
          python3 -m pip install --user -r "${{ github.workspace }}/.github/dependencies/zizmor/requirements.txt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan workflows for unsafe patterns
        run: |
          zizmor -c .github/config/zizmor.yml --format plain .github/workflows/
          zizmor -c .github/config/zizmor.yml --format plain .github/actions/
          zizmor -c .github/config/zizmor.yml --format plain examples/

  openssf-scorecard:
    name: Score supply chain security posture
    if: >
      github.event.repository.fork == false &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@v2.16.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run repository security scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Summarize scorecard for job log
        run: |
          set -euo pipefail
          python3 scripts/scorecard_summary.py --repo "github.com/${{ github.repository }}" results.sarif \
            | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
