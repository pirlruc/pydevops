# Optional supply-chain signal for repositories with lockfiles (see docs/improvements.md).

name: Dependency review

on:
  pull_request:
    paths:
      - "**/uv.lock"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/requirements*.txt"
      - "**/poetry.lock"
      - "**/Pipfile.lock"
      - ".github/dependencies/jscpd/package.json"
      - ".github/dependabot.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    env:
      # JS-based actions (checkout, dependency-review, harden-runner) until they default to Node 24.
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v4
