# Optional supply-chain signal for repositories with lockfiles (see docs/improvements.md).

name: Dependency review

on:
  pull_request:
    paths:
      - "**/uv.lock"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/requirements*.txt"
      - "**/poetry.lock"
      - "**/Pipfile.lock"
      - ".github/dependencies/jscpd/package.json"
      - ".github/dependabot.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review pull request dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner with audited egress
        uses: step-security/harden-runner@v2.16.1
        with:
          egress-policy: audit

      - name: Check out pull request head
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Uses Node 20 until a node24 release; checkout@v5 is Node 24 native.
      - name: Compare dependency changes versus base
        uses: actions/dependency-review-action@v4.9.0
