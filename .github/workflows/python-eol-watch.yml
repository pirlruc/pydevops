# Opens GitHub Issues when tracked Python versions are past EOL or within 90 days of EOL.
# Data: endoflife.date API + .github/config/python-support-versions.json
# (Dependabot does not emit interpreter EOL alerts; this workflow is the complementary signal.)

name: Python interpreter EOL watch

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/config/python-support-versions.json"
      - ".github/workflows/python-eol-watch.yml"

permissions:
  contents: read
  issues: write

jobs:
  eol-check:
    name: Track Python support end of life
    runs-on: ubuntu-latest
    steps:
      - name: Check out policy configuration
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Open or skip EOL tracking issues
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const policy = JSON.parse(
              fs.readFileSync('.github/config/python-support-versions.json', 'utf8'),
            );
            const versions = policy.interpreter_versions;
            if (!Array.isArray(versions) || versions.length === 0) {
              core.setFailed('interpreter_versions missing in python-support-versions.json');
              return;
            }

            const res = await fetch('https://endoflife.date/api/python.json');
            if (!res.ok) {
              core.setFailed(`endoflife.date HTTP ${res.status}`);
              return;
            }
            /** @type {Array<{cycle:string,eol:string|boolean,support?:string|boolean}>} */
            const table = await res.json();
            const today = new Date();
            const msPerDay = 86400000;

            const { owner, repo } = context.repo;
            const listOpen = async (titlePrefix) => {
              const { data } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              return data.filter((i) => i.title.startsWith(titlePrefix));
            };

            const pastIssues = await listOpen('[Python EOL]');
            const warnIssues = await listOpen('[Python EOL warning]');

            for (const v of versions) {
              const row = table.find((x) => x.cycle === v);
              if (!row) {
                core.warning(`No endoflife.date entry for Python ${v}`);
                continue;
              }
              if (row.eol === false) {
                continue;
              }
              const eol = new Date(row.eol);
              if (Number.isNaN(eol.getTime())) {
                core.warning(`Bad EOL date for Python ${v}: ${row.eol}`);
                continue;
              }

              const daysToEol = Math.ceil((eol.getTime() - today.getTime()) / msPerDay);

              if (today > eol) {
                const title = `[Python EOL] Interpreter ${v} is past end-of-life (${row.eol})`;
                if (pastIssues.some((i) => i.title === title)) {
                  continue;
                }
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body:
                    `Python **${v}** is past its published EOL date (**${row.eol}**) per [endoflife.date](https://endoflife.date/python).\n\n` +
                    `**Next steps:** raise \`requires-python\` in \`pyproject.toml\`, bump defaults in \`python-quality.yml\` and \`.github/config/python-support-versions.json\`, run \`uv lock\`, and adjust caller workflows.\n\n` +
                    `_Dependabot version updates do not cover CPython EOL; this issue was opened by \`python-eol-watch.yml\`._`,
                });
                core.info(`Created EOL issue for Python ${v}`);
                continue;
              }

              if (daysToEol <= 90 && daysToEol >= 0) {
                const title = `[Python EOL warning] Interpreter ${v} reaches EOL on ${row.eol}`;
                if (warnIssues.some((i) => i.title === title)) {
                  continue;
                }
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body:
                    `Python **${v}** reaches community EOL on **${row.eol}** (about **${daysToEol}** days from now) per [endoflife.date](https://endoflife.date/python).\n\n` +
                    `Plan an upgrade of \`requires-python\`, workflow defaults, and \`.github/config/python-support-versions.json\` before that date.\n\n` +
                    `_This is not a Dependabot alert; it is from \`python-eol-watch.yml\`._`,
                });
                core.info(`Created EOL warning issue for Python ${v}`);
              }
            }
