name: Mutation testing (Mutmut)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  mutmut:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Install Mutmut
        run: |
          MUT=$(grep -v '^#' .github/dependencies/mutmut/requirements.txt | head -1 | tr -d ' \n\r')
          uv tool install "${MUT}"

      - name: Install project + test deps
        run: |
          if [ -f pyproject.toml ]; then uv sync --all-groups --all-extras; fi

      - name: Run Mutmut
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mutmut run || true

      - name: Upload mutmut artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: |
            .mutmut-cache
            .mutmut
            mutmut-results*
