name: CI Python Image

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-python/**"
      - ".github/workflows/ci-python-image.yml"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      dockerfile: docker/ci-python/Dockerfile
      working_directory: .
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: true

  build:
    needs: [lint]
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-python
      dockerfile: docker/ci-python/Dockerfile
      image_name: ci-python:ci
      artifact_name: container-image-ci-python
      handoff_package: ci-python
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      blocking: true
      size_class: ci_toolchain
      dhi_login: true
      structure_test_config: docker/ci-python/container-structure-test.yml
      ignorefile: docker/ci-python/.trivyignore.yaml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-alpine:
    needs: [lint]
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-python
      dockerfile: docker/ci-python/Dockerfile.alpine
      image_name: ci-python:ci-alpine
      artifact_name: container-image-ci-python-alpine
      handoff_package: ci-python
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      blocking: true
      size_class: ci_toolchain
      dhi_login: true
      structure_test_config: docker/ci-python/container-structure-test.yml
      ignorefile: docker/ci-python/.trivyignore.yaml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  scan-posture:
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-posture-debian
      sarif_category: trivy-posture-debian
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: os,library
      ignorefile: none
      blocking: false

  scan-posture-alpine:
    needs: build-alpine
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
      results_artifact: container-scan-posture-alpine
      sarif_category: trivy-posture-alpine
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      pkg_types: os,library
      ignorefile: none
      blocking: false

  publish:
    needs: [build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-python
      dockerfile: docker/ci-python/Dockerfile
      image_name: ci-python
      dockerhub_image: pirlruc/ci-python
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      platforms: linux/amd64
      tag_suffix: -debian
      tag_alias_unsuffixed: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      environment: ${{ github.event_name == 'release' && 'release' || '' }}
      image_title: ci-python
      image_description: Python quality toolchain. Debian 13. Non-root 1000:1000.
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: Python quality toolchain for CI jobs
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      verify_command: ruff --version
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-alpine:
    needs: [build-alpine]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      context: docker/ci-python
      dockerfile: docker/ci-python/Dockerfile.alpine
      image_name: ci-python
      dockerhub_image: pirlruc/ci-python
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
      platforms: linux/amd64
      tag_suffix: -alpine
      tag_alias_unsuffixed: false
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      environment: ${{ github.event_name == 'release' && 'release' || '' }}
      image_title: ci-python
      image_description: Python quality toolchain. Alpine 3.24. Non-root 1000:1000.
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      verify_command: ruff --version
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release-digests:
    needs: [publish, publish-alpine]
    if: >-
      github.event_name == 'release' &&
      needs.publish.result == 'success' &&
      needs.publish-alpine.result == 'success'
    permissions:
      contents: write
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-release-digests.yml@2c5e1ebe9797828128e01f3941b5a02650abe59a
    with:
      images: >-
        ghcr.io/${{ github.repository_owner }}/ci-python:${{ github.event.release.tag_name }}
        ghcr.io/${{ github.repository_owner }}/ci-python:${{ github.event.release.tag_name }}-debian
        ghcr.io/${{ github.repository_owner }}/ci-python:${{ github.event.release.tag_name }}-alpine
