# Authored backlog for pydevops.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.5.0/github-issue-adr

milestones:
  - name: Guardrails alignment
    epics:
      - id: PDO-001
        status: done
        title: High tier reads org Python profile.thresholds.yml
        overview:
          problem: >-
            Strictness tiers were hardcoded and drifted from org floors; average
            CC/MI gates were missing.
          goal: >-
            High loads docs/guardrails/python/profile.thresholds.yml; avg CC and
            avg MI gates enforced; below-High consumers document deviations.
        architecture:
          target: scripts/quality_gates/config.py
          modules:
            - scripts/quality_gates/config.py
            - scripts/quality_gates/gates_complexity.py
            - scripts/quality_gates/readers_radon.py
            - scripts/quality_gates/evaluation.py
            - scripts/org_thresholds.py
            - scripts/radon_metrics.py
            - scripts/complexity_gate_rules.py
        acceptance_criteria:
          - High CC max/avg and MI min/avg match org YAML when submodule present
          - Avg CC and avg MI rows appear in gates.json
        guardrail_refs:
          - PY-CPLX-001
          - PY-CPLX-002
          - PY-TEST-002
          - PY-DOC-001
        tasks:
          - id: PDO-001-T1
            status: done
            title: Wire High floors and average complexity gates
            instructions:
              files:
                - scripts/quality_gates/config.py
                - scripts/quality_gates/gates_complexity.py
                - scripts/quality_gates/readers_radon.py
                - scripts/org_thresholds.py
                - scripts/radon_metrics.py
                - scripts/complexity_gate_rules.py
            verification:
              - uv run pytest
            guardrail_refs:
              - PY-CPLX-001

  - name: Scaffold adoption
    epics:
      - id: PDO-002
        status: done
        title: Adopt github-scaffold submodule and retire handoff-and-commits.mdc
        overview:
          problem: >-
            handoff-and-commits.mdc duplicates scaffold ai-agent-handoff and
            conventional-commits rules; no scaffold submodule to sync from.
          goal: >-
            Pin .github/scaffold, sync templates, replace the duplicate Cursor
            rule with the scaffold pair.
        architecture:
          target: .github/scaffold submodule
          modules:
            - .gitmodules
            - .cursor/rules/
        acceptance_criteria:
          - scaffold submodule pinned
          - handoff-and-commits.mdc removed after sync
        guardrail_refs:
          - CI-008
        tasks:
          - id: PDO-002-T1
            status: done
            title: Add scaffold submodule and sync Cursor rules
            instructions:
              files:
                - .gitmodules
                - .cursor/rules/
            verification:
              - git submodule status .github/scaffold
            guardrail_refs:
              - CI-008

  - name: Supply-chain reusable gates
    epics:
      - id: PDO-003
        status: done
        title: Promote license gate and SBOM into a reusable workflow
        overview:
          problem: >-
            scripts/license_gate.py and syft SBOM generation in ci_run_quality.sh
            work only inside pydevops. Guardrails SC-LIC-* (GR-SC-001) need a
            citable implementation other Python repos can call.
          goal: >-
            License deny-list + SPDX/CycloneDX SBOM live in pirlruc/commondevops
            common-supply-chain.yml (scripts/license_gate.py moved; pin after first push).
        architecture:
          target: .github/workflows/ and scripts/license_gate.py
          modules:
            - scripts/license_gate.py
            - scripts/ci_run_quality.sh
            - .github/workflows/
        acceptance_criteria:
          - Reusable workflow or documented entrypoint for license + SBOM
          - Inputs include license_deny_list
          - Other Python repos can pin by SHA without copying scripts
        guardrail_refs:
          - PY-SEC-001
          - SC-DEP-001
        tasks:
          - id: PDO-003-T1
            status: done
            title: Package license_gate and syft SBOM as reusable workflow
            instructions:
              files:
                - scripts/license_gate.py
                - .github/workflows/
            verification:
              - actionlint on new/changed workflow
            guardrail_refs:
              - PY-SEC-001

  - name: Continuous improvement
    epics:
      - id: PDO-004
        status: done
        title: Adopt and verify multi-ecosystem Dependabot (SC-DEP-*)
        overview:
          problem: >-
            Dependency updates may still use per-ecosystem schedules, missing
            ecosystems, or shapes that do not produce one monthly multi-ecosystem
            PR. SC-DEP-001/002/003 require covering every package ecosystem, a
            single grouped PR, and the org cadence/semver policy.
          goal: >-
            Align .github/dependabot.yml with the org multi-ecosystem monthly
            shape (seed from github-scaffold templates/dependabot.example.yml when
            needed); confirm Insights grouping after the config is on the default
            branch; document any justified deviations.
        architecture:
          target: .github/dependabot.yml
          modules:
            - .github/dependabot.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - dependabot.yml uses a monthly multi-ecosystem group covering this repo's ecosystems
          - open-pull-requests-limit and semver policy match SC-DEP-003 / supply-chain thresholds
          - Insights confirmation recorded in handoff after merge to default branch (or GitHub limitation noted)
        guardrail_refs:
          - SC-DEP-001
          - SC-DEP-002
          - SC-DEP-003
        tasks:
          - id: PDO-004-T1
            status: done
            title: Rewrite or confirm Dependabot multi-ecosystem config
            instructions:
              files:
                - .github/dependabot.yml
            verification:
              - rg -n "multi-ecosystem|schedule|package-ecosystem" .github/dependabot.yml
            guardrail_refs:
              - SC-DEP-001
              - SC-DEP-002
          - id: PDO-004-T2
            status: done
            title: Record Insights confirmation in handoff after default-branch land
            instructions:
              files:
                - docs/ai-agent-handoff.md
            verification:
              - Handoff notes Insights one-PR grouping outcome or documents blocker
            guardrail_refs:
              - SC-DEP-003

      - id: PDO-006
        status: done
        title: Least-privilege permissions on reusable Python workflows (CI-025)
        overview:
          problem: >-
            Reusable and devops workflows must default-deny GITHUB_TOKEN and use
            persist-credentials: false on every checkout (CI-025).
          goal: >-
            Top-level permissions: {} with minimal per-job scopes; CI-024 Dependabot
            skips on jobs that need Actions secrets.
        architecture:
          target: .github/workflows/
          modules:
            - .github/workflows/
        acceptance_criteria:
          - Every workflow has top-level permissions default-deny
          - Every actions/checkout sets persist-credentials: false
          - Jobs needing secrets skip dependabot[bot]
        guardrail_refs:
          - CI-025
          - CI-024
        tasks:
          - id: PDO-006-T1
            status: done
            title: Apply CI-025 permissions and persist-credentials across workflows
            instructions:
              files:
                - .github/workflows/
            verification:
              - rg -n "permissions:|persist-credentials" .github/workflows/
            guardrail_refs:
              - CI-025
      - id: PDO-005
        status: done
        title: Review for improvements, bugs, and design flaws
        overview:
          problem: >-
            Backlog and automation can drift toward process or docs hygiene only.
            The repo needs a deliberate review of the current implementation that
            surfaces improvements, bugs, and design flaws — not only polish — and
            records material follow-ups in docs/issues.yml.
          goal: >-
            Run an ai-reviewer (or equivalent) pass against this repository's
            current code, workflows, scripts, and docs; append only material new
            epics/tasks under Continuous improvement (or record a justified no-op).
        architecture:
          target: Repository review into docs/issues.yml
          modules:
            - docs/issues.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - Review explicitly covers improvements, bugs, and design flaws in shipped implementation
          - Material findings appended to docs/issues.yml via PR (budget at most 2 epics / 6 tasks) or handoff records justified no-op
          - Does not re-file work already covered by existing epic/task ids
        tasks:
          - id: PDO-005-T1
            status: done
            title: Run review pass and append material issues.yml findings
            instructions:
              files:
                - docs/issues.yml
                - docs/ai-agent-handoff.md
            verification:
              - PR appends material findings within budget, or handoff records justified no-op

      - id: PDO-WF-001
        status: done
        title: Reconcile maintainer CI triggers and consumer pin examples with the tree
        overview:
          problem: >-
            Maintainer docs and workflow comments disagreed with the YAML that
            actually ran. docs/workflows.md described devops-ci.yml as
            pull-request/push CI while both workflows were workflow_dispatch only
            (quota mode). README.md and examples pinned @v1.2.0, a tag that never
            existed. docs/dependency-management.md said quarterly Dependabot while
            .github/dependabot.yml is monthly.
          goal: >-
            Docs and workflow comments match the tree; consumer examples pin a tag
            that exists; maintainer CI uses the sibling trigger policy.
        decision: >-
          In the context of dispatch-only maintainer CI, facing an operator grant
          to restore sibling triggers so Dependabot PRs get checks, we decided
          push+PR on main for devops-ci.yml and Thursday cron 17 6 * * 4 for
          devops-scheduled.yml (after commondevops Mon / containerdevops Tue /
          cppdevops Wed), to achieve green Dependabot merges, accepting Actions
          minutes. Consumer pins move to annotated tag 1.1.0 (then 2.0.0 at
          release). dependabot-metadata.yml is removed.
        out_of_scope:
          - Label-gated CI as an alternative to push+PR
        architecture:
          target: .github/workflows/ and consumer-facing docs
          modules:
            - .github/workflows/devops-ci.yml
            - .github/workflows/devops-scheduled.yml
            - docs/workflows.md
            - README.md
            - examples/call-python-quality.yml
        acceptance_criteria:
          - workflows.md trigger text matches on: in devops-ci.yml and devops-scheduled.yml
          - Consumer examples pin an annotated tag that exists
          - Dependabot cadence documented as monthly in workflows.md
        guardrail_refs:
          - CI-008
        tasks:
          - id: PDO-WF-001-T1
            status: done
            title: Adopt sibling push+PR+Thursday triggers and align docs
            instructions:
              files:
                - docs/workflows.md
                - .github/workflows/devops-ci.yml
                - .github/workflows/devops-scheduled.yml
                - .github/workflows/README.md
            verification:
              - rg -n "workflow_dispatch|pull_request|17 6 \\* \\* 4" docs/workflows.md .github/workflows/devops-ci.yml .github/workflows/devops-scheduled.yml
            guardrail_refs:
              - CI-008
          - id: PDO-WF-001-T2
            status: done
            title: Replace non-existent @v1.2.0 consumer pins with a tag that exists
            instructions:
              files:
                - README.md
                - examples/call-python-quality.yml
                - examples/README.md
            verification:
              - "! grep -n '@v1.2.0' README.md examples"
              - git tag -l --points-at HEAD || git tag -l

      - id: PDO-GATE-001
        status: done
        title: Load org floors in maintainer CI and pin Gitleaks for Dependabot
        overview:
          problem: >-
            Two self-CI / scanner paths bypass the sources of truth this repo
            otherwise ships. (1) devops-ci.yml inlines Radon with max CC 5 and MI
            floor 40, and interrogate --fail-under 95, instead of
            scripts/org_thresholds.py. High-tier quality_gates already load
            docs/guardrails/python/profile.thresholds.yml (max CC 8, min MI 40,
            doc_coverage 95). Self-CI CC≤5 is stricter than the High product gate
            with no recorded reason. (2) qa-secrets-sast curls Gitleaks 8.21.2 from
            GitHub Releases; that version is not in .github/dependencies/ and
            Dependabot cannot bump it (SC-DEP-001).
          goal: >-
            Maintainer Radon/interrogate floors come from org_thresholds (or a
            recorded deviation if self-CI stays stricter than High); Gitleaks
            version lives in a Dependabot-visible pin consumed by the composite.
        decision: >-
          In the context of quality_gates reading org YAML while devops-ci bakes
          CC 5 and a curl-pinned Gitleaks, facing silent drift from High floors and
          SC-DEP-001, we decided one org-threshold loader for self-CI plus a
          pinned Gitleaks manifest, to achieve lockstep with the product gates,
          accepting a follow-up if self-CI is intentionally stricter than High.
        architecture:
          target: .github/workflows/devops-ci.yml and qa-secrets-sast
          modules:
            - .github/workflows/devops-ci.yml
            - scripts/org_thresholds.py
            - .github/actions/qa-secrets-sast/action.yml
            - .github/dependencies/
        acceptance_criteria:
          - devops-ci Radon CC/MI and interrogate fail-under read org_thresholds (or a documented intentional stricter self-CI policy)
          - Gitleaks version is a pinned file under .github/dependencies/ (or equivalent Dependabot-visible manifest)
          - qa-secrets-sast reads that pin instead of a hardcoded 8.21.2
        guardrail_refs:
          - PY-CPLX-001
          - PY-CPLX-002
          - PY-DOC-001
          - SC-DEP-001
        tasks:
          - id: PDO-GATE-001-T1
            status: done
            title: Drive devops-ci Radon and interrogate floors from org_thresholds
            instructions:
              files:
                - .github/workflows/devops-ci.yml
                - scripts/org_thresholds.py
            verification:
              - uv run pytest tests/test_org_thresholds.py
              - rg -n "org_thresholds|fail-under|overall_max" .github/workflows/devops-ci.yml
            guardrail_refs:
              - PY-CPLX-001
              - PY-CPLX-002
              - PY-DOC-001
          - id: PDO-GATE-001-T2
            status: done
            title: Move Gitleaks version out of qa-secrets-sast into a Dependabot-visible pin
            instructions:
              files:
                - .github/actions/qa-secrets-sast/action.yml
                - .github/dependencies/
                - .github/dependabot.yml
            verification:
              - rg -n "GITLEAKS" .github/actions/qa-secrets-sast/action.yml .github/dependencies
            guardrail_refs:
              - SC-DEP-001

      - id: PDO-DEP-001
        status: done
        title: Uncomment Dependabot git registry after DEPENDABOT_GITHUB_TOKEN exists
        overview:
          problem: >-
            Dependabot Updates fail cloning private pirlruc/github-scaffold
            (.github/scaffold submodule). Personal-account GitHub has no org
            "Grant Dependabot access" control. .github/dependabot.yml already
            contains a commented registries: github-private stub (password
            ${{secrets.DEPENDABOT_GITHUB_TOKEN}}). Uncommenting that stub before
            the secret exists fails Dependabot closed for every ecosystem.
          goal: >-
            After the operator stores a fine-grained PAT as a Dependabot secret
            named DEPENDABOT_GITHUB_TOKEN (Settings → Secrets and variables →
            Dependabot — not an Actions secret), uncomment top-level registries:
            and attach registries: [github-private] to each updates entry that
            clones this private-git tree, then confirm Insights / grouped updates
            no longer fail on github-scaffold.
        decision: >-
          In the context of Dependabot failing to clone private github-scaffold,
          facing commented registries stubs that would also fail closed without a
          secret, we decided the operator must create DEPENDABOT_GITHUB_TOKEN as a
          Dependabot secret before anyone uncomments registries:, to achieve
          private-submodule clones without pretending the token was set in this
          review pass.
        description: >-
          This Epic does not set the secret. Actions secrets are invisible to
          Dependabot version updates; a repository Actions secret named
          DEPENDABOT_GITHUB_TOKEN would not fix the clone failure. The PAT needs
          Contents: Read on private submodules (pirlruc/github-scaffold,
          pirlruc/guardrails) and private reusable-workflow hosts, not only
          package dependencies. Seed comments:
          https://github.com/pirlruc/github-scaffold/blob/main/templates/dependabot.example.yml
        out_of_scope:
          - Creating or rotating DEPENDABOT_GITHUB_TOKEN (operator-only)
          - Uncommenting registries: before that Dependabot secret exists
          - Treating an Actions secret as a substitute
        architecture:
          target: .github/dependabot.yml
          modules:
            - .github/dependabot.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - Operator has created Dependabot secret DEPENDABOT_GITHUB_TOKEN (not an Actions secret)
          - Top-level registries: github-private is uncommented and referenced from updates entries that clone private git
          - Dependabot Updates no longer fail cloning pirlruc/github-scaffold
        guardrail_refs:
          - SC-DEP-001
          - SC-DEP-002
        tasks:
          - id: PDO-DEP-001-T1
            status: done
            title: Uncomment registries and attach github-private after the Dependabot secret exists
            instructions:
              files:
                - .github/dependabot.yml
            verification:
              - rg -n "registries:|DEPENDABOT_GITHUB_TOKEN|github-private" .github/dependabot.yml
            guardrail_refs:
              - SC-DEP-001

      - id: PDO-PIN-001
        status: done
        title: Re-pin docs/guardrails from tag 1.0.0 to 1.6.0
        overview:
          problem: >-
            docs/guardrails is pinned at 925b9f32659936382c67850ec125a182261710bf
            (annotated tag 1.0.0). Current org default is 1.6.0. SC-DEP-004
            requires the documented bootstrap ref, gitlink SHA, and annotated tag
            to name the same revision. The stale pack omits later principles
            (including python lint_exception_max_days) that High-tier consumers of
            this QaaS repo should inherit. This review must not bump the submodule.
          goal: >-
            Re-pin docs/guardrails to annotated tag 1.6.0 in a dedicated change;
            remediate newly failing gates or record deviations in
            docs/guardrail-deviations.yml.
        decision: >-
          In the context of a 1.0.0 gitlink while guardrails is at 1.6.0, facing
          SC-DEP-004 freshness and High-tier floor drift, we decided a dedicated
          pin-bump Epic rather than bundling the submodule move with this review
          PR, to achieve an assertable tag match, accepting that High floors stay
          on the 1.0.0 profile until that bump lands.
        out_of_scope:
          - Bumping docs/guardrails in the PDO-005 review PR
        architecture:
          target: docs/guardrails gitlink
          modules:
            - docs/guardrails
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - git submodule status docs/guardrails resolves to annotated tag 1.6.0
          - Newly failing gates are remediated or recorded in docs/guardrail-deviations.yml
        guardrail_refs:
          - SC-DEP-004
        tasks:
          - id: PDO-PIN-001-T1
            status: done
            title: Re-pin docs/guardrails at guardrails 1.6.0 and remediate gates
            instructions:
              files:
                - docs/guardrails
            verification:
              - git -C docs/guardrails describe --tags --exact-match
            guardrail_refs:
              - SC-DEP-004
