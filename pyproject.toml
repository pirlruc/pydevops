[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devops-quality-tooling"
version = "0.1.0"
description = "Scripts and tooling for Quality-as-a-Service reusable workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

# Pin quality CLI versions here. Regenerate:
#   bash scripts/export_pinned_requirements.sh
#
# Semgrep and Locust are *not* in this lockfile: semgrep requires tomli~=2.0.1 while
# pip-audit>=2.10 needs tomli>=2.2.1 — same resolution graph is impossible. Their pins
# live in .github/dependencies/semgrep/requirements.txt and dast-python/requirements.txt.
[dependency-groups]
scripts = [
    "radon>=6.0,<7",
]
quality-tools = [
    "ruff==0.15.9",
    "pylint==4.0.5",
    "mypy==1.20.0",
    "pydoclint==0.8.3",
    "interrogate==1.7.0",
    "bandit==1.9.4",
    "deptry==0.25.1",
    "pip-audit==2.10.0",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pylint-json2html==0.5.0",
]
dev = [
    { include-group = "quality-tools" },
    { include-group = "scripts" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/devops_quality"]

[tool.uv]
default-groups = ["scripts", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=scripts",
    "--cov=src/devops_quality",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]

[tool.coverage.run]
source = ["scripts", "src/devops_quality"]
omit = ["tests/*"]

[tool.interrogate]
fail-under = 95
ignore-init-method = true
ignore-init-module = false
verbose = 1
exclude = [".venv", "tests", ".git", ".github", "examples", "dist", "build"]

[tool.pylint.main]
max-line-length = 100
fail-under = 9.5
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint."messages control"]
disable = [
    "import-error",
    "no-name-in-module",
]

[tool.pylint.design]
max-args = 8
