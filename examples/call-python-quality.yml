---
# Minimal example: call the reusable Python quality workflow from an application repository.
# Copy to your app repo as `.github/workflows/quality.yml` and adjust tag.
#
# See docs/workflows.md for inputs, secrets, and required caller permissions.
name: Quality (QaaS)
on:
  pull_request:
  push:
    branches: [main, master]
# CI-031: the caller job must grant the union of nested job permissions.
# CI-034: devops_repository and devops_ref must match the uses pin.
permissions: {}
jobs:
  python-quality:
    permissions:
      actions: write
      contents: read
      pull-requests: write
      security-events: write
    uses: pirlruc/pydevops/.github/workflows/python-quality.yml@3.0.0
    with:
      devops_repository: pirlruc/pydevops
      devops_ref: 3.0.0
      strictness_level: Medium
      docstring_format: Google
      enable_dast: false
      license_deny_list: '[]'
      working_directory: .
      python_version: '3.13'
    secrets:
      caller_pat: ${{ secrets.caller_pat }}
      checkout_token: ${{ secrets.PYDEVOPS_READ_TOKEN }}
