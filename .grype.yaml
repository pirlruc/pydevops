# Image scans run from the repo root. braces 3.0.3 is the jscpd
# dependency in docker/ci-python/package-lock.json. No upstream fix.
# Review 2027-01-31, the same date as docker/ci-python/.trivyignore.yaml.
ignore:
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    package:
      name: braces
      version: 3.0.3
    reason: jscpd 4.0.5 has no patched braces. Review 2027-01-31.
